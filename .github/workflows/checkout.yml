name: Checkout integration test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JWT_SECRET: checkout-ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name checkout-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec checkout-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec checkout-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
      - name: Verify checkout and rollback
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const express = require('express');
          const jwt = require('jsonwebtoken');
          const mongoose = require('mongoose');
          const Product = require('./server/models/Product');
          const User = require('./server/models/User');
          const Cart = require('./server/models/Cart');
          const Order = require('./server/models/Order');
          const routes = require('./server/routes/orders');
          async function run() {
            let server;
            try {
              await mongoose.connect('mongodb://localhost:27017/checkout_ci?replicaSet=rs0');
              const app = express();
              app.use(express.json());
              app.use('/orders', routes);
              server = app.listen(0, '127.0.0.1');
              await new Promise(resolve => server.once('listening', resolve));
              const ids = Array.from({length: 3}, () => new mongoose.Types.ObjectId());
              const productId = new mongoose.Types.ObjectId();
              const missingStock = new mongoose.Types.ObjectId();
              const item = product => ({product, quantity: 1, price: 99});
              await Order.init();
              await User.collection.insertMany(ids.map((_id, i) => ({_id, isActive: true, email: 'demo'+i+'@example.test'})));
              await Product.collection.insertMany([
                {_id: productId, slug: 'last-unit', stock: 1, price: 19.5, isActive: true},
                {_id: missingStock, slug: 'sold-out', stock: 0, price: 5, isActive: true}
              ]);
              await Cart.create(ids.map((user, i) => ({user, items: i === 2 ? [item(productId), item(missingStock)] : [item(productId)]})));
              const address = {street:'Demo Street',city:'Demo City',state:'Demo',zipCode:'00000',country:'Demo'};
              const checkout = userId => fetch('http://127.0.0.1:'+server.address().port+'/orders', {
                method:'POST', headers:{'content-type':'application/json', authorization:'Bearer '+jwt.sign({userId}, process.env.JWT_SECRET)},
                body:JSON.stringify({shippingAddress:address,paymentMethod:'cod'})
              });
              const failed = await checkout(ids[2]);
              assert.equal(failed.status, 409, await failed.text());
              assert.equal((await Product.findById(productId)).stock, 1);
              assert.equal(await Order.countDocuments(), 0);
              assert.equal((await Cart.findOne({user:ids[2]})).items.length, 2);
              const responses = await Promise.all(ids.slice(0,2).map(checkout));
              const bodies = await Promise.all(responses.map(res => res.json()));
              assert.deepEqual(responses.map(res=>res.status).sort(), [201,409], JSON.stringify(bodies));
              assert.equal((await Product.findById(productId)).stock, 0);
              assert.equal(await Order.countDocuments(), 1);
              const winner = responses.findIndex(res => res.status === 201);
              assert.equal(bodies[winner].total, 19.5);
              assert.equal((await Cart.findOne({user:ids[winner]})).items.length, 0);
              assert.equal((await Cart.findOne({user:ids[1-winner]})).items.length, 1);
            } finally {
              if (server) await new Promise(resolve => server.close(resolve));
              await mongoose.disconnect();
            }
          }
          run().catch(error => { console.error(error); process.exitCode = 1; });
          JS
